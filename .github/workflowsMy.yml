
name: Build OwpenGram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check project
        run: |
          pwd
          ls -la
          test -f go.mod
          find cmd -maxdepth 2 -name '*.go'

      - name: Build server and admin
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/gramsrv ./cmd/telesrv

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/gramsrv-admin ./cmd/telesrv-admin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Linux-AMD64
          path: dist/*
          

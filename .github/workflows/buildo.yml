
name: Build OwpenGram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build OwpenGram
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/gramsrv ./cmd/telesrv

      - name: Verify binary
        run: |
          file dist/gramsrv
          ls -lh dist/gramsrv

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Linux-AMD64
          path: dist/gramsrv
          if-no-files-found: error
          

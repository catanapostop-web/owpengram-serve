name: Build Go Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: |
        # Заходим в папку telesrv
        cd telesrv
        # Собираем бинарник и сохраняем его на уровень выше (в корень)
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../owpengram-server .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: owpengram-linux-binary
        path: owpengram-server

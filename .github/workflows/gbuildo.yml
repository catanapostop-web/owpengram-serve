
name: Build OwpenGram Admin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build admin panel
        run: |
          mkdir -p dist
          go build -o dist/owpengram-admin ./cmd/telesrv-admin

      - uses: actions/upload-artifact@v4
        with:
          name: owpengram-admin-linux-amd64
          path: dist/owpengram-admin
          

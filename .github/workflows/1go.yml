
name: Build OwpenGram Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/gramsrv ./cmd/telesrv

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/gramsrv-admin ./cmd/telesrv-admin

      - name: Check binaries
        run: |
          file dist/*
          ls -lh dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Full-Linux-AMD64
          path: dist/
          

name: Build OwpenGram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download OwpenGram
        uses: actions/checkout@v4
        with:
          repository: owpengram/owpengram-server

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Build Android ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          go build -p 4 -o gramsrv ./cmd/telesrv
          file gramsrv

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Android-ARM64
          path: gramsrv

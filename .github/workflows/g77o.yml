
name: Build Admin Panel Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Admin Panel
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/admin-panel ./cmd/telesrv-admin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-linux-amd64
          path: dist/admin-panel
          
